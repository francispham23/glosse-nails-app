name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      HUSKY: "0"
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_CONVEX_URL: https://example.convex.cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Convex checks
        run: npm run verify:backend
      - name: App lint and tests
        run: npm run verify:app
      - name: Expo platform exports
        run: npx expo export --platform all --output-dir /tmp/glosse-quality-export --max-workers 2
